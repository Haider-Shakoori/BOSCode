name: BOSCode v1.1 Rust Format

on:
  push:
    branches:
      - "feat/v1.1-memory-history"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.1-memory-history
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git status --porcelain) {
            git add src-tauri/src
            git commit -m "style: format v1.1 memory backend"
            git push origin HEAD:feat/v1.1-memory-history
          }
