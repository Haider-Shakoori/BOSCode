name: BOSCode Rustfmt Fix

on:
  push:
    branches:
      - "feat/batch-08-production-release"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-08-production-release

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/*.rs
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes required."
            exit 0
          }
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/batch-08-production-release
