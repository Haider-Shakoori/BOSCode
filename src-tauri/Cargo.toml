[package]
name = "boscode"
version = "0.1.0"
description = "BOSCode — AI Coding Agent by BusinessOS"
authors = ["BusinessOS"]
edition = "2021"

[lib]
name = "boscode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", features = ["windows-native"] }
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

similar = "2"
