[package]
name = "boscode"
version = "1.1.0"
description = "BOSCode — AI Coding Agent by BusinessOS"
authors = ["BusinessOS"]
edition = "2021"

[lib]
name = "boscode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", features = ["windows-native"] }
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

similar = "2"

tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
shell-words = "1.1"
which = "8"

tauri-plugin-updater = "2.12"
tauri-plugin-log = "2"

rusqlite = { version = "0.32", features = ["bundled"] }
